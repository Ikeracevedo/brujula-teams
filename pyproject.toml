[project]
name = "brujula"
version = "0.1.0"
description = "Asistente que unifica pendientes dispersos de Microsoft 365 y los devuelve con su origen"
requires-python = ">=3.12"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
show_error_codes = true
disallow_untyped_defs = true
no_implicit_optional = true
files = ["app", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"